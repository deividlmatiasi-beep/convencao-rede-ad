<html lang="pt-BR">
<head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f4f8;--card:#fff;--ink:#121420;--ink2:#3b3f4e;--mut:#737889;--line:#e6e8ef;--red:#c8102e;--red2:#8f0a20;--ok:#0f8a52;--warn:#c27a12;--blue:#2457c5;--nav:#0f1220;--nav2:#191d30;--r:18px;--sh:0 1px 2px rgba(18,20,32,.05),0 8px 24px -12px rgba(18,20,32,.18)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
h1,h2,h3,.kpi .v,.hero .big,.tab-title{font-family:Manrope,Inter,sans-serif}
a{color:var(--blue);text-decoration:none}
/* ---- shell ---- */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100dvh}
.side{background:linear-gradient(180deg,var(--nav),var(--nav2));color:#fff;padding:22px 16px calc(16px + env(safe-area-inset-bottom));position:sticky;top:0;height:100dvh;overflow:auto;display:flex;flex-direction:column}
.logo{display:flex;align-items:center;gap:12px;padding:4px 8px 18px}.logo .m{width:42px;height:42px;border-radius:12px;background:var(--red);display:grid;place-items:center;font:800 17px Manrope;letter-spacing:.5px;box-shadow:0 6px 16px -6px rgba(200,16,46,.8)}
.logo b{display:block;font:700 15px Manrope;line-height:1.1}.logo small{color:#9aa0b8;font-size:11.5px}
.nav{display:flex;flex-direction:column;gap:2px}.nav button{all:unset;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:#b9bed2;font-weight:600;font-size:13.5px;cursor:pointer}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff}.nav button.on{background:rgba(255,255,255,.1);color:#fff;box-shadow:inset 3px 0 0 var(--red)}
.nav .ic{width:22px;text-align:center;font-size:16px}
.side .foot{margin-top:auto;padding:14px 8px 0;color:#9aa0b8;font-size:12px;line-height:1.5}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:#dfe2ec}.chip i{width:8px;height:8px;border-radius:50%;background:#9aa0b8}.chip.on i{background:#39d98a}.chip.err i{background:#ff6b6b}
.content{min-width:0;padding:26px 28px 90px}
.topbar{display:none}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.phead h2{font-size:24px;margin:0;letter-spacing:-.3px}.phead p{margin:4px 0 0;color:var(--mut);font-size:13.5px;max-width:760px}
/* ---- mobile ---- */
@media(max-width:900px){
 .app{grid-template-columns:1fr}.side{display:none}
 .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:30;background:linear-gradient(135deg,var(--nav),#2a1420 120%);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
 .topbar .logo{padding:0}.topbar .logo .m{width:36px;height:36px;font-size:15px}
 .content{padding:16px 14px calc(86px + env(safe-area-inset-bottom))}
 .phead h2{font-size:20px}
 .bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
 .bnav button{all:unset;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--mut);padding:4px 8px;border-radius:10px;min-width:56px;cursor:pointer}.bnav button .ic{font-size:20px}.bnav button.on{color:var(--red)}
 .sheet{position:fixed;inset:0;z-index:40;background:rgba(10,12,20,.45);display:none;align-items:flex-end}.sheet.on{display:flex}
 .sheet .pane{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom));max-height:80dvh;overflow:auto}
 .sheet .pane button{all:unset;display:flex;gap:12px;align-items:center;padding:13px 10px;border-radius:12px;font-weight:600;width:100%;cursor:pointer}.sheet .pane button.on{background:#fbe9ec;color:var(--red)}
 .sheet .h{width:40px;height:4px;border-radius:4px;background:#d8dbe4;margin:2px auto 12px}
}
@media(min-width:901px){.bnav,.sheet{display:none!important}}
/* ---- components ---- */
.grid{display:grid;gap:14px}.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh)}
.kpi{position:relative;overflow:hidden}.kpi .l{padding-right:44px;color:var(--mut);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}.kpi .v{font-size:28px;font-weight:800;margin-top:8px;letter-spacing:-.6px;line-height:1}.kpi .s{color:var(--mut);font-size:12px;margin-top:7px}
.kpi .ico{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:#f3f4f8}
.kpi.red .v{color:var(--red)}.kpi.ok .v{color:var(--ok)}.kpi.warn .v{color:var(--warn)}
.hero{border-radius:22px;padding:24px;color:#fff;background:radial-gradient(1200px 400px at 110% -40%,rgba(255,255,255,.14),transparent 60%),linear-gradient(120deg,#8f0a20 0%,#c8102e 45%,#1a1d2e 100%);box-shadow:0 18px 40px -22px rgba(200,16,46,.7);display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:center}
.hero .eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;opacity:.85}.hero .big{font-size:42px;font-weight:800;letter-spacing:-1px;line-height:1.05;margin:6px 0 4px}.hero .sub{opacity:.9;font-size:13.5px}
.hero .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.hero .st{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:12px}.hero .st b{display:block;font:800 24px Manrope;letter-spacing:-.5px}.hero .st span{font-size:11.5px;opacity:.9}
@media(max-width:640px){.hero{grid-template-columns:1fr;padding:20px}.hero .big{font-size:32px}.kpi .v{font-size:22px;white-space:nowrap}.g4{grid-template-columns:repeat(2,1fr)}.card{padding:14px}}
h3{font-size:12px;margin:0 0 12px;color:var(--mut);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.btn{border:1px solid var(--line);background:#fff;padding:9px 14px;border-radius:12px;font-weight:600;font-size:13px;cursor:pointer;color:var(--ink);font-family:inherit;box-shadow:0 1px 2px rgba(18,20,32,.04)}
.btn.p{background:var(--red);border-color:var(--red);color:#fff}.btn.p:hover{background:var(--red2)}.btn.s{background:#f3f4f8}.btn:disabled{opacity:.5;cursor:default}.btns{display:flex;gap:8px;flex-wrap:wrap}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:#fff;box-shadow:var(--sh)}
table{border-collapse:separate;border-spacing:0;width:100%;min-width:640px}th{background:#f8f9fc;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.5px;text-align:left;padding:11px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1}
td{padding:10px 12px;border-bottom:1px solid #f1f2f6;vertical-align:top;font-size:13px}tbody tr:hover td{background:#fafbfe}tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}td.b{font-weight:600}tfoot td{background:#f8f9fc;font-weight:700}
td input,td select,td textarea{width:100%;border:1px solid #d9dce6;border-radius:9px;padding:7px 9px;font:inherit;font-size:13px;background:#fffdf3}td input[type=checkbox]{width:18px;height:18px;accent-color:var(--red)}
td input.n{text-align:right}textarea{min-height:54px;resize:vertical}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}
.tag.g{background:#e3f6ec;color:var(--ok)}.tag.y{background:#fdf1dc;color:var(--warn)}.tag.r{background:#fbe9ec;color:var(--red)}.tag.b{background:#e7eefc;color:var(--blue)}.tag.m{background:#eef0f5;color:var(--mut)}
.bar{height:8px;background:#eef0f5;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#ff5a73);border-radius:999px}.bar.g i{background:linear-gradient(90deg,var(--ok),#3ddc84)}
.ring{--p:0;width:92px;height:92px;border-radius:50%;background:conic-gradient(var(--ok) calc(var(--p)*1%),#eef0f5 0);display:grid;place-items:center;flex:none}.ring b{width:70px;height:70px;border-radius:50%;background:#fff;display:grid;place-items:center;font:800 18px Manrope}
.muted{color:var(--mut)}.small{font-size:12px}.mt{margin-top:14px}.mb{margin-bottom:14px}
ul.pts{margin:0;padding-left:0;list-style:none}ul.pts li{display:flex;gap:10px;margin:8px 0;line-height:1.45}ul.pts li:before{content:"";flex:none;width:8px;height:8px;border-radius:50%;background:var(--red);margin-top:6px}
.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#121420;color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:60;max-width:90vw}.toast.on{opacity:1}
@media(min-width:901px){.toast{bottom:22px}}
.del{color:var(--red);cursor:pointer;font-weight:700;background:none;border:0;font-size:16px}
.filt{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}.filt select,.filt input{padding:9px 11px;border:1px solid var(--line);border-radius:11px;font:inherit;background:#fff}
.tl{position:relative;padding-left:24px}.tl:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl .it{position:relative;margin-bottom:14px}.tl .it:before{content:"";position:absolute;left:-22px;top:5px;width:12px;height:12px;border-radius:50%;background:#c9cdda;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.tl .it.now:before{background:var(--red)}.tl .it.done:before{background:var(--ok)}
.pill{font-size:11px;color:var(--mut)}
.row{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;padding:9px 0;border-bottom:1px solid #f1f2f6}.row:last-child{border-bottom:0}
label.f{display:block;font-size:12px;color:var(--mut);font-weight:600}label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:5px;padding:9px 10px;border:1px solid #d9dce6;border-radius:10px;font:inherit;background:#fffdf3}
/* docs */
.docs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.doc{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column}
.doc .th{height:140px;background:#f3f4f8;display:grid;place-items:center;overflow:hidden}.doc .th img{width:100%;height:100%;object-fit:cover}.doc .th .pdf{font:800 26px Manrope;color:var(--red);display:flex;flex-direction:column;align-items:center;gap:4px}.doc .th .pdf small{font:600 11px Inter;color:var(--mut)}
.doc .bd{padding:12px 13px;display:flex;flex-direction:column;gap:5px;flex:1}.doc .bd b{font-size:13.5px;line-height:1.3}.doc .bd .meta{color:var(--mut);font-size:12px}
.doc .ft{display:flex;gap:8px;padding:0 13px 12px;flex-wrap:wrap}
.drop{border:2px dashed #d9dce6;border-radius:16px;padding:22px;text-align:center;background:#fff;color:var(--mut);cursor:pointer}.drop.on{border-color:var(--red);background:#fff6f7}
.avatar{width:22px;height:22px;border-radius:50%;vertical-align:middle;margin-right:4px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,12,20,.5);display:none;align-items:center;justify-content:center;padding:14px}.modal.on{display:flex}.modal .box{background:#fff;border-radius:20px;padding:20px;width:min(560px,100%);max-height:88dvh;overflow:auto}
.pv img{max-width:100%;border-radius:12px}
</style>
</head>

 `
 <div id="drop" class="drop mb">Arraste arquivos aqui ou toque em <b>Enviar arquivo</b> · imagens e PDF até 20 MB</div>
 <div class="filt"><select data-fcat><option value="">Todas as categorias</option>${CATS.map(x=>`<option ${f===x?"selected":""}>${x}</option>`).join("")}</select><span class="muted small">${rows.length} arquivo(s)</span></div>
 <div class="docs">${rows.map(x=>`<div class="doc"><div class="th">${x.ct==="link"?`<div class="pdf">LINK<small>${esc((()=>{try{return new URL(x.url).hostname}catch(_){return ""}})())}</small></div>`:isImg(x)?`<img src="${esc(x.url)}" alt="">`:`<div class="pdf">${/pdf/.test(x.ct||"")?"PDF":"DOC"}<small>${esc((x.ct||"").split("/")[1]||"")}</small></div>`}</div>
  <div class="bd"><b>${esc(x.nome)}</b><div><span class="tag ${x.cat==="Orçamento"?"b":"m"}">${esc(x.cat)}</span> ${x.status?statusTag(x.status):""}</div><div class="meta">${esc(x.forn||"")}${x.valor?" · <b>"+brl(x.valor)+"</b>":""}</div>${x.obs?`<div class="meta">${esc(x.obs)}</div>`:""}<div class="meta">${who(x.by)} ${esc(x.when||"")}</div></div>
  <div class="ft"><a class="btn" href="${esc(x.url)}" target="_blank">Abrir</a><button class="btn" data-docedit="${x.id}">Editar</button>${canWrite?`<button class="btn" data-docdel="${x.id}" style="color:var(--red)">Excluir</button>`:""}</div></div>`).join("")||'<div class="card muted">Nenhum arquivo ainda.</div>'}</div>`};

function docForm(d,isNew){
 return `<h2 style="margin:0 0 4px;font-size:18px">${isNew?"Novo documento":"Editar documento"}</h2><p class="muted small" style="margin:0 0 12px">${esc(d.file?d.file.name:d.nome)}</p>
 <div class="grid" style="gap:10px">
 <label class="f">Nome<input data-d="nome" value="${esc(d.nome)}"></label>
 <label class="f">Categoria<select data-d="cat">${CATS.map(c=>`<option ${c===d.cat?"selected":""}>${c}</option>`).join("")}</select></label>
 <label class="f">Fornecedor / origem<input data-d="forn" value="${esc(d.forn||"")}"></label>
 <label class="f">Valor (R$)<input class="n" data-d="valor" value="${d.valor||""}"></label>
 <label class="f">Status<select data-d="status">${["Recebido","Em análise","Aprovado","Recusado"].map(c=>`<option ${c===(d.status||"Recebido")?"selected":""}>${c}</option>`).join("")}</select></label>
 <label class="f">Observação<textarea data-d="obs">${esc(d.obs||"")}</textarea></label></div>
 <div class="btns mt"><button class="btn p" id="docsave">${isNew?"Enviar":"Salvar"}</button><button class="btn s" id="doccancel">Cancelar</button></div>`;
}
async function askName(){
  if(ME) return ME;
  return new Promise(res=>{
    openModal(`<h2 style="margin:0 0 6px;font-size:18px">Quem está usando?</h2><p class="muted small" style="margin:0 0 12px">Seu nome aparece nos arquivos e no histórico. Fica salvo neste aparelho.</p><label class="f">Seu nome<input id="nm" placeholder="Ex.: Deivid Lucas"></label><div class="btns mt"><button class="btn p" id="nmok">Continuar</button></div>`);
    const ok=()=>{const v=$("#nm").value.trim();if(!v){$("#nm").focus();return}ME=v;try{localStorage.setItem("conv_nome",v)}catch(_){}renderWho();closeModal();res(v)};
    $("#nmok").onclick=ok;$("#nm").onkeydown=e=>{if(e.key==="Enter")ok()};setTimeout(()=>{const n=$("#nm");if(n)n.focus()},50);
  });
}
function renderWho(){const el=$("#who");if(el)el.innerHTML=ME?`Você: <b>${esc(ME)}</b> · <a href="#" data-chgname style="color:#c7cad3">trocar</a>`:""}
let QUEUE=[];
async function handleFiles(list){
  if(!sb){toast("Sem conexão com o banco");return}
  QUEUE=[...list]; await askName(); nextUpload();
}
const safeName=n=>n.normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9._-]+/g,"_").slice(-80);
function nextUpload(){
  const file=QUEUE.shift(); if(!file){return}
  if(file.size>50*1024*1024){toast("Arquivo acima de 50 MB: "+file.name);nextUpload();return}
  const d={file,nome:file.name.replace(/\.[^.]+$/,""),cat:/pdf/i.test(file.type)?"Orçamento":"Arte / Design",forn:"",valor:"",status:"Recebido",obs:""};
  openModal(docForm(d,true));
  $("#doccancel").onclick=()=>{closeModal();nextUpload()};
  $("#docsave").onclick=async()=>{
    const meta=readDocForm(); $("#docsave").disabled=true; $("#docsave").textContent="Enviando…";
    try{
      const path=`docs/${Date.now()}-${safeName(file.name)}`;
      const up=await sb.storage.from(BUCKET).upload(path,file,{contentType:file.type||"application/octet-stream",upsert:false});
      if(up.error) throw up.error;
      const url=sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
      const ins=await sb.from("conv_docs").insert({...meta,path,url,ct:file.type||"",size:file.size,autor:ME});
      if(ins.error) throw ins.error;
      await logit("docs",`arquivo enviado: ${meta.nome} (${meta.cat}${meta.valor?", "+brl(meta.valor):""})`);
      toast("Arquivo salvo ✓"); closeModal(); await loadDocs(); nextUpload();
    }catch(e){console.error(e);toast("Falha no envio: "+(e.message||e));$("#docsave").disabled=false;$("#docsave").textContent="Enviar"}
  };
}
async function addLink(){
  if(!sb){toast("Sem conexão com o banco");return}
  await askName();
  const form=docForm({nome:"",cat:"Arte / Design",status:"Recebido"},true).replace(/<h2[\s\S]*?<\/p>/,"");
  openModal(`<h2 style="margin:0 0 4px;font-size:18px">Adicionar link</h2><p class="muted small" style="margin:0 0 12px">Canvas de design, pasta do Drive, proposta online…</p><label class="f" style="margin-bottom:10px">Endereço (https://…)<input data-d="url" placeholder="https://"></label>${form}`);
  $("#doccancel").onclick=closeModal;
  $("#docsave").onclick=async()=>{const m=readDocForm();if(!/^https?:\/\//.test(m.url||"")){toast("Informe um endereço começando com https://");return}
    try{const r=await sb.from("conv_docs").insert({...m,ct:"link",autor:ME});if(r.error)throw r.error;await logit("docs",`link adicionado: ${m.nome||m.url}`);toast("Link salvo ✓");closeModal();await loadDocs()}catch(e){toast("Não foi possível salvar: "+(e.message||e))}};
}
function readDocForm(){const m={};document.querySelectorAll("[data-d]").forEach(el=>{m[el.dataset.d]=el.dataset.d==="valor"?num(el.value):el.value.trim()});return m}
function openModal(h){$("#modalbox").innerHTML=h;$("#modal").classList.add("on")} function closeModal(){$("#modal").classList.remove("on")}
async function logit(sec,msg){ if(!sb)return; try{ await sb.from("conv_log").insert({sec,msg,autor:ME||null}); await loadLog(); }catch(e){console.warn(e)} }

/* ---------- render ---------- */
function render(){
  CALC=calc();
  $("#nav").innerHTML=SECTIONS.map(([k,l,ic])=>`<button class="${k===cur?"on":""}" data-tab="${k}"><span class="ic">${ic}</span>${l}</button>`).join("");
  $("#bnav").innerHTML=SECTIONS.filter(([k])=>BOTTOM.includes(k)).map(([k,l,ic])=>`<button class="${k===cur?"on":""}" data-tab="${k}"><span class="ic">${ic}</span>${l}</button>`).join("")+`<button class="${BOTTOM.includes(cur)?"":"on"}" data-sheet><span class="ic">☰</span>Mais</button>`;
  $("#sheetlist").innerHTML=SECTIONS.map(([k,l,ic])=>`<button class="${k===cur?"on":""}" data-tab="${k}"><span class="ic">${ic}</span>${l}</button>`).join("");
  $("#main").innerHTML=V[cur]();
  const d=CALC.dias;$("#tsub").textContent=d>=0?`faltam ${d} dias · ${dfmt(S.premissas.data)}`:"realizada";
  if(cur==="docs"){const dz=$("#drop");if(dz){dz.ondragover=e=>{e.preventDefault();dz.classList.add("on")};dz.ondragleave=()=>dz.classList.remove("on");dz.ondrop=e=>{e.preventDefault();dz.classList.remove("on");handleFiles(e.dataTransfer.files)};dz.onclick=()=>$("#fileinp")?.click()}
    const fi=$("#fileinp");if(fi)fi.onchange=e=>{handleFiles(e.target.files);e.target.value=""}}
}
/* ---------- editing ---------- */
function readInputs(key){
  const root=document.querySelector(`[data-tbl="${key}"]`)||document; const rows=(key==="cronograma"?S.cronograma.blocos:S[key]);
  root.querySelectorAll("[data-k]").forEach(el=>{const i=+el.dataset.i,k=el.dataset.k;let r;
    if(key==="checklist"&&S._fchk){r=S.checklist.filter(x=>x.fase===S._fchk)[i]} else if(key==="presenca"&&S._fpos){r=S.presenca.filter(x=>x.posto===S._fpos)[i]} else r=rows[i];
    if(!r)return;
    if(el.type==="checkbox")r[k]=el.checked;
    else if(el.classList.contains("n")){const v=el.value.trim();r[k]=v[0]==="@"?v:(v===""?"":num(v))}
    else r[k]=el.value;
  });
}
document.addEventListener("click",async e=>{
  if(e.target.id==="modal"){closeModal();return}
  const t=e.target.closest("[data-addlink],[data-chgname],[data-tab],[data-sheet],[data-edit],[data-cancel],[data-save],[data-add],[data-del],[data-pos],[data-docedit],[data-docdel]");if(!t)return;
  if(t.dataset.addlink!==undefined){addLink();return}
  if(t.dataset.chgname!==undefined){e.preventDefault();ME="";try{localStorage.removeItem("conv_nome")}catch(_){}await askName();return}
  if(t.dataset.sheet!==undefined){$("#sheet").classList.toggle("on");return}
  if(t.dataset.tab){if(editing&&BK){S=JSON.parse(BK)}editing=null;cur=t.dataset.tab;$("#sheet").classList.remove("on");render();window.scrollTo(0,0);return}
  if(t.dataset.pos){e.preventDefault();S._fpos=t.dataset.pos;render();return}
  if(t.dataset.edit){editing=t.dataset.edit;BK=JSON.stringify(S);render();return}
  if(t.dataset.cancel!==undefined){S=JSON.parse(BK);editing=null;render();return}
  if(t.dataset.add){const k=t.dataset.add;readInputs(k);const arr=k==="cronograma"?S.cronograma.blocos:S[k];const blank={};Object.keys(arr[0]||{}).forEach(x=>blank[x]=typeof arr[0][x]==="boolean"?false:(typeof arr[0][x]==="number"?0:""));
    if(k==="presenca"&&S._fpos)blank.posto=S._fpos;if(k==="checklist"){blank.status="Pendente";blank.prazo=S.premissas.data}arr.push(blank);render();return}
  if(t.dataset.del!==undefined){const k=t.closest("[data-tbl]").dataset.tbl;readInputs(k);let arr=k==="cronograma"?S.cronograma.blocos:S[k];let i=+t.dataset.del;
    if(k==="checklist"&&S._fchk)i=S.checklist.indexOf(S.checklist.filter(x=>x.fase===S._fchk)[i]);if(k==="presenca"&&S._fpos)i=S.presenca.indexOf(S.presenca.filter(x=>x.posto===S._fpos)[i]);
    arr.splice(i,1);render();return}
  if(t.dataset.save){await save(t.dataset.save);return}
  if(t.dataset.docedit){const f=FILES.find(x=>x.id===t.dataset.docedit);if(!f)return;openModal(docForm(f,false));
    $("#doccancel").onclick=closeModal;$("#docsave").onclick=async()=>{try{await askName();const r=await sb.from("conv_docs").update(readDocForm()).eq("id",f.id);if(r.error)throw r.error;await loadDocs();await logit("docs",`documento atualizado: ${f.nome}`);toast("Salvo ✓");closeModal()}catch(err){toast("Não foi possível salvar")}};return}
  if(t.dataset.docdel){const f=FILES.find(x=>x.id===t.dataset.docdel);if(!f)return;
    openModal(`<h2 style="font-size:18px;margin:0 0 8px">Excluir "${esc(f.nome)}"?</h2><p class="muted">O arquivo será removido para todos.</p><div class="btns mt"><button class="btn p" id="dc">Excluir</button><button class="btn s" id="dx">Cancelar</button></div>`);
    $("#dx").onclick=closeModal;$("#dc").onclick=async()=>{try{await askName();const r=await sb.from("conv_docs").delete().eq("id",f.id);if(r.error)throw r.error;if(f.path){try{await sb.storage.from(BUCKET).remove([f.path])}catch(_){}}await loadDocs();await logit("docs",`documento excluído: ${f.nome}`);toast("Excluído");closeModal()}catch(err){toast("Não foi possível excluir")}};return}
});
document.addEventListener("change",e=>{if(e.target.dataset.fchk!==undefined){S._fchk=e.target.value;render()}if(e.target.dataset.fpos!==undefined){S._fpos=e.target.value;render()}if(e.target.dataset.fcat!==undefined){S._fcat=e.target.value;render()}});
const TABLE_DOC={orcamento:"orcamento",receitas:"receitas",cronograma:"cronograma",checklist:"checklist",presenca:"presenca",trofeus:"trofeus",placas:"placas",postos:"postos",brindes:"brindes"};
async function save(key){
  let docs=[];
  if(key==="premissas"){document.querySelectorAll("[data-p]").forEach(el=>{const k=el.dataset.p;S.premissas[k]=k==="data"?el.value:(k==="margem"?num(el.value)/100:num(el.value))});docs=["premissas"]}
  else if(key==="pontos"){S.pontos=$("[data-pontos]").value.split("\n").map(x=>x.trim()).filter(Boolean);docs=["pontos"]}
  else if(key==="semanas"){document.querySelectorAll("[data-k]").forEach(el=>{S.semanas[+el.dataset.i][el.dataset.k]=el.value});docs=["semanas"]}
  else if(key==="trofeus_cfg"){document.querySelectorAll("[data-c]").forEach(el=>{S.trofeus_cfg[el.dataset.c]=num(el.value)});docs=["trofeus_cfg"]}
  else if(key==="cronograma"){readInputs("cronograma");const i=$("[data-ini]");if(i)S.cronograma.inicio=i.value;docs=["cronograma"]}
  else {readInputs(key);docs=[TABLE_DOC[key]]}
  editing=null;
  if(!sb){render();toast("Sem conexão com o banco — alteração só nesta tela");return}
  render(); await askName();
  try{
    for(const d of docs){const data=d==="cronograma"?S.cronograma:(Array.isArray(S[d])?{rows:S[d]}:S[d]); const r=await sb.from("conv_plan").upsert({key:d,data,updated_by:ME,updated_at:new Date().toISOString()}); if(r.error) throw r.error;}
    await logit(docs.join(","),"salvo no painel"); toast("Salvo ✓");
  }catch(err){console.error(err);toast("Não foi possível salvar: "+(err.message||err))}
  render();
}
/* ---------- boot ---------- */
function applyDoc(name,data){ if(!data)return; if(name==="cronograma")S.cronograma=data; else if(name==="premissas"||name==="trofeus_cfg")S[name]={...S[name],...data}; else if(data.rows)S[name]=data.rows; }
function setConn(cls,txt){for(const id of ["#conn","#conn2"]){const el=$(id);if(el){el.className="chip "+cls;el.innerHTML="<i></i>"+(id==="#conn2"?txt.split(" ")[0]:txt)}}}
const fmtTS=s=>{try{return new Date(s).toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"})}catch(_){return ""}};
async function loadPlan(){ const r=await sb.from("conv_plan").select("key,data"); if(r.error) throw r.error; for(const row of r.data){ if(DOCS.includes(row.key)) applyDoc(row.key,row.data); } }
async function loadDocs(){ const r=await sb.from("conv_docs").select("*").order("created_at",{ascending:false}); if(r.error){console.warn(r.error);return} FILES=r.data.map(d=>({...d,when:fmtTS(d.created_at),by:d.autor})); if(!editing)render(); }
async function loadLog(){ const r=await sb.from("conv_log").select("*").order("created_at",{ascending:false}).limit(200); if(r.error){console.warn(r.error);return} S.log=r.data.map(l=>({when:fmtTS(l.created_at),sec:l.sec,msg:l.msg,autor:l.autor})); if(!editing&&cur==="log")render(); }
(async()=>{
  render(); renderWho();
  try{
    if(!window.supabase) throw new Error("biblioteca não carregou");
    sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false}});
    await loadPlan(); await loadDocs(); await loadLog();
    setConn("on","conectado"); render();
    sb.channel("conv").on("postgres_changes",{event:"*",schema:"public",table:"conv_plan"},p=>{ const row=p.new; if(!row||!row.key||editing)return; applyDoc(row.key,row.data); render(); })
      .on("postgres_changes",{event:"*",schema:"public",table:"conv_docs"},()=>loadDocs())
      .on("postgres_changes",{event:"*",schema:"public",table:"conv_log"},()=>loadLog())
      .subscribe();
    setInterval(async()=>{ if(editing)return; try{ await loadPlan(); await loadDocs(); render(); }catch(_){} },60000);
  }catch(e){ console.error(e); sb=null; setConn("err","sem conexão"); render(); }
})();
</script>
</body>
</html>
